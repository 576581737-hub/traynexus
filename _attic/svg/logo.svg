<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff" stop-opacity="0.96"/>
      <stop offset="40%" stop-color="#e8eef6" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#dce5f0" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="greenArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orangeArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fcd34d"/>
      <stop offset="50%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="plateShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4b5580" flood-opacity="0.28"/>
    </filter>
    <filter id="ringShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#334155" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- NO background rect – true transparency -->

  <!-- rounded glass square -->
  <rect x="48" y="48" width="416" height="416" rx="88" ry="88"
        fill="url(#glassBg)" stroke="#ffffff" stroke-width="5" stroke-opacity="0.85"
        filter="url(#plateShadow)"/>

  <!-- glass highlight -->
  <path d="M 136 68 Q 56 70, 54 140 L 54 200 Q 52 120, 138 66 Z" fill="#ffffff" opacity="0.45"/>

  <!-- ── progress-ring tracks (unfilled boundary) ── -->
  <g opacity="0.55">
    <circle cx="256" cy="256" r="100" fill="none" stroke="#cbd5e1" stroke-width="26"/>
    <circle cx="256" cy="256" r="140" fill="none" stroke="#cbd5e1" stroke-width="30"/>
  </g>
  <!-- thin silver framing borders -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.7"/>
  <circle cx="256" cy="256" r="157" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.7"/>

  <!-- ── filled progress arcs (both start at 12 o'clock) ── -->
  <g fill="none" stroke-linecap="round" filter="url(#ringShadow)">
    <!-- inner green (点亮): 88% fill, clockwise -->
    <path d="M 256 156 A 100 100 0 1 1 187.54 183.10"
          stroke="url(#greenArc)" stroke-width="26"/>
    <!-- outer orange (内存): 48% fill, clockwise -->
    <path d="M 256 116 A 140 140 0 0 1 273.55 394.91"
          stroke="url(#orangeArc)" stroke-width="30"/>
  </g>

  <!-- ── lightning bolt (traced from reference, geometric rounded corners, smaller) ── -->
  <path d="M 267.0 190.5 L 217.9 259.6 Q 215.9 262.5 217.9 265.4 L 218.4 266.0 Q 220.5 268.9 224.0 269.0 L 236.2 269.2 Q 246.2 269.4 243.6 279.0 L 234.0 315.0 Q 232.9 319.4 235.1 323.3 L 235.6 324.2 Q 237.9 328.1 240.7 324.5 L 296.7 252.1 Q 299.0 249.2 297.3 245.9 L 296.9 245.1 Q 295.3 241.8 291.6 241.6 L 280.0 241.0 Q 270.0 240.4 270.8 230.5 L 273.5 195.2 Q 273.7 192.2 271.4 190.4 L 270.9 190.0 Q 268.7 188.1 267.0 190.5 Z"
        fill="url(#boltGrad)" stroke="url(#boltGrad)" stroke-width="6"
        stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="256" cy="258" rx="42" ry="52" fill="#fef08a" opacity="0.08"/>
</svg>
